[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "get-stock"
version = "1.0.0"
description = "Low-frequency CNINFO stock announcement crawler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Scrapy>=2.11,<3.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pypdf>=5.0,<7.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
agent = [
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
]
deepseek-agent = [
    "langchain-openai>=1.0,<2.0",
]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
get-stock = "get_stock.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: performs low-frequency requests against CNINFO (disabled by default)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
